<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát & Nhận Diện AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            width: 100vw;
            padding: 20px 30px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }
        header h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 12px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .tab-bar { display: flex; gap: 10px; background: #0f172a; padding: 6px; border-radius: 8px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--text-sub); font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { background: var(--primary); color: #0f172a; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .media-container {
            width: 100%;
            max-height: 520px;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .media-container img {
            max-width: 100%;
            max-height: 520px;
            object-fit: contain;
        }

        .stream-controls { display: flex; gap: 12px; margin-top: 16px; justify-content: center; }

        .form-group { margin-bottom: 16px; }
        .input-control { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 0.95rem; outline: none; }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem; }
        .btn-full { width: 100%; padding: 12px; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-success { background: var(--success); color: #0f172a; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #0f172a; }

        .log-table-wrapper { flex: 1; overflow-y: auto; max-height: 520px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        th { background: #0f172a; color: var(--text-sub); position: sticky; top: 0; }

        .person-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
        }

        .person-card {
            background: #0f172a;
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .person-info h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 700;
            margin: 0;
        }

        .person-info p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin: 0;
        }

        .person-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 480px; border: 1px solid var(--border-color); }

        .sample-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .sample-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-eye"></i> AI Face Detection System</h1>
    </header>

    <div class="card" style="margin-bottom: 16px;">
        <div class="tab-bar" style="margin-bottom: 0;">
            <button class="tab-btn active" id="camTabBtn" onclick="switchTab('cam')">
                <i class="fa-solid fa-video"></i> Live Camera / IP Cam
            </button>
            <button class="tab-btn" id="fileTabBtn" onclick="switchTab('file')">
                <i class="fa-solid fa-file-video"></i> Tải Video Lên
            </button>
            <button class="tab-btn" id="manageTabBtn" onclick="switchTab('manage')">
                <i class="fa-solid fa-users-gear"></i> Quản Lý Dữ Liệu Khuôn Mặt
            </button>
        </div>
    </div>

    <div id="viewSection" class="dashboard-grid">
        <div class="card">
            <div id="camTab" class="tab-content active">
                <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center; background: #0f172a; padding: 8px; border-radius: 8px;">
                    <select id="camSourceSelect" class="input-control" style="width: 180px;" onchange="toggleIpInput()">
                        <option value="webcam">Webcam Máy Tính</option>
                        <option value="iphone">iPhone (DroidCam)</option>
                    </select>
                    <input type="text" id="iphoneIpInput" placeholder="IP iPhone (VD: 192.168.1.15)" class="input-control" style="width: 220px; display: none;">
                    <button type="button" class="btn btn-primary" onclick="changeCameraSource()"><i class="fa-solid fa-sync"></i> Kết Nối</button>
                </div>
            </div>

            <div id="fileTab" class="tab-content">
                <form id="uploadVideoForm" class="form-group" style="margin-bottom: 12px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="file" id="videoFileInput" accept="video/*" class="input-control" required>
                        <button type="submit" class="btn btn-primary" style="white-space: nowrap;"><i class="fa-solid fa-microchip"></i> Phân Tích AI Video</button>
                    </div>
                </form>
            </div>

            <div class="media-container">
                <img id="cameraStream" src="/video_feed?source=webcam" alt="Stream đã tắt">
            </div>

            <div class="stream-controls">
                <button type="button" id="pauseBtn" class="btn btn-warning" onclick="togglePause()"><i class="fa-solid fa-pause"></i> Tạm Dừng</button>
                <button type="button" id="stopBtn" class="btn btn-danger" onclick="stopStream()"><i class="fa-solid fa-power-off"></i> Tắt Video / Cam</button>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 1.1rem; color: var(--primary); margin-bottom: 12px;"><i class="fa-solid fa-list-check"></i> Nhật Ký Phát Hiện Realtime</h2>
            <div class="log-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Tên Người</th>
                            <th>Độ Tin Cậy</th>
                            <th>Thời Gian</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr><td colspan="3" style="text-align: center; color: var(--text-sub);">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="manageTab" class="tab-content card">
        <h2 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 16px;"><i class="fa-solid fa-user-plus"></i> Đăng Ký Người Dùng Mới</h2>
        <form id="registerForm" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 24px;">
            <div>
                <label style="font-size: 0.85rem; color: var(--text-sub);">Họ và Tên:</label>
                <input type="text" id="personName" placeholder="Nhập tên người dùng" class="input-control" required>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--text-sub);">Chọn Ảnh mẫu (Chọn 1 hoặc nhiều ảnh):</label>
                <input type="file" id="faceImageInput" accept="image/*" multiple class="input-control" required>
            </div>
            <button type="submit" class="btn btn-success" style="padding: 11px 16px;"><i class="fa-solid fa-floppy-disk"></i> Lưu Mới</button>
        </form>

        <hr style="border-color: var(--border-color); margin-bottom: 20px;">

        <h2 style="font-size: 1.2rem; color: var(--primary);"><i class="fa-solid fa-users"></i> Danh Sách Người Đã Lưu</h2>
        <div id="personCardGrid" class="person-grid"></div>
    </div>

    <div id="sampleModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--primary); margin-bottom: 14px;">Quản Lý Mẫu Ảnh</h3>
            <div id="sampleList" style="max-height: 350px; overflow-y: auto; margin-bottom: 16px;"></div>
            <button class="btn btn-primary btn-full" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        let currentSource = 'webcam';
        let isPausedState = false;
        let currentPersonIdForModal = null;
        let currentPersonNameForModal = '';

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (type === 'cam' || type === 'file') {
                document.getElementById('viewSection').style.display = 'grid';
                document.getElementById('manageTab').classList.remove('active');

                if (type === 'cam') {
                    document.getElementById('camTabBtn').classList.add('active');
                    document.getElementById('camTab').classList.add('active');
                    changeCameraSource();
                } else {
                    document.getElementById('fileTabBtn').classList.add('active');
                    document.getElementById('fileTab').classList.add('active');
                    stopStream();
                }
            } else if (type === 'manage') {
                document.getElementById('viewSection').style.display = 'none';
                document.getElementById('manageTabBtn').classList.add('active');
                document.getElementById('manageTab').classList.add('active');
                stopStream();
                loadPersons();
            }
        }

        function stopStream() {
            const streamImg = document.getElementById('cameraStream');
            streamImg.src = "";
            fetch('/api/control_stream?action=stop', { method: 'POST' });
        }

        function toggleIpInput() {
            const source = document.getElementById('camSourceSelect').value;
            document.getElementById('iphoneIpInput').style.display = (source === 'iphone') ? 'block' : 'none';
        }

        function changeCameraSource() {
            const source = document.getElementById('camSourceSelect').value;
            const ip = document.getElementById('iphoneIpInput').value.trim();
            if (source === 'iphone' && !ip) return alert('Vui lòng nhập IP iPhone!');

            currentSource = source;
            const streamImg = document.getElementById('cameraStream');
            streamImg.src = `/video_feed?source=${source}&ip=${encodeURIComponent(ip)}&t=${new Date().getTime()}`;
        }

        async function togglePause() {
            const action = isPausedState ? "resume" : "pause";
            await fetch(`/api/control_stream?action=${action}`, { method: 'POST' });
            isPausedState = !isPausedState;
            document.getElementById('pauseBtn').innerHTML = isPausedState ? `<i class="fa-solid fa-play"></i> Tiếp Tục` : `<i class="fa-solid fa-pause"></i> Tạm Dừng`;
        }

        setInterval(async () => {
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                const tbody = document.getElementById('logTableBody');
                if (data.logs && data.logs.length > 0) {
                    tbody.innerHTML = data.logs.map(log => `
                        <tr>
                            <td style="color: var(--primary); font-weight: 600;">${log.name}</td>
                            <td>${log.confidence}</td>
                            <td style="color: var(--text-sub);">${log.time}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-sub);">Chưa có nhật ký phát hiện</td></tr>`;
                }
            } catch (e) {}
        }, 1000);

        async function loadPersons() {
            const res = await fetch('/api/persons');
            const data = await res.json();
            const grid = document.getElementById('personCardGrid');

            if (!data.persons || data.persons.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-sub);">Chưa có dữ liệu khuôn mặt nào.</p>`;
                return;
            }

            grid.innerHTML = data.persons.map(p => `
                <div class="person-card">
                    <div class="person-info">
                        <h3>${p.name}</h3>
                        <p>Số mẫu ảnh: <b style="color: var(--primary);">${p.sample_count}</b></p>
                    </div>

                    <input type="file" id="addMoreInput_${p.id}" accept="image/*" multiple style="display: none;" onchange="uploadMoreImages(${p.id}, '${p.name}')">

                    <div class="person-actions">
                        <button class="btn btn-success" onclick="document.getElementById('addMoreInput_${p.id}').click()">
                            <i class="fa-solid fa-plus"></i> Thêm ảnh
                        </button>
                        <button class="btn btn-warning" onclick="openManageModal(${p.id}, '${p.name}')">
                            <i class="fa-solid fa-images"></i> Xóa ảnh mẫu
                        </button>
                        <button class="btn btn-primary" onclick="renamePerson(${p.id}, '${p.name}')">
                            <i class="fa-solid fa-pen"></i> Sửa
                        </button>
                        <button class="btn btn-danger" onclick="deletePerson(${p.id})">
                            <i class="fa-solid fa-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function openManageModal(personId, personName) {
            currentPersonIdForModal = personId;
            if (personName) {
                currentPersonNameForModal = personName;
            }
            document.getElementById('modalTitle').innerText = `Danh sách ảnh mẫu của: ${currentPersonNameForModal}`;
            document.getElementById('sampleModal').style.display = 'flex';

            const listContainer = document.getElementById('sampleList');
            listContainer.innerHTML = `<p style="color: var(--text-sub); text-align: center;">Đang tải dữ liệu...</p>`;

            try {
                const res = await fetch(`/api/person_embeddings?person_id=${personId}`);
                if (!res.ok) {
                    throw new Error(`Mã lỗi HTTP: ${res.status}`);
                }

                const data = await res.json();
                const samples = data.embeddings || [];

                if (samples.length === 0) {
                    listContainer.innerHTML = `<p style="color: var(--text-sub); text-align: center;">Không có mẫu ảnh nào trong DB.</p>`;
                } else {
                    listContainer.innerHTML = samples.map((item, index) => {
                        const imgSrc = item.image_path ? `/${item.image_path}` : '';
                        const imgHtml = imgSrc
                            ? `<img src="${imgSrc}" class="sample-thumb" alt="Mẫu ${index + 1}">`
                            : `<div class="sample-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--text-sub);"><i class="fa-solid fa-image"></i></div>`;

                        return `
                            <div class="sample-item">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    ${imgHtml}
                                    <span style="font-size: 0.9rem; font-weight: 500;">Mẫu ảnh #${index + 1}</span>
                                </div>
                                <button class="btn btn-danger" onclick="deleteSingleSample(${item.id})">
                                    <i class="fa-solid fa-trash"></i> Xóa
                                </button>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("Lỗi:", err);
                listContainer.innerHTML = `<p style="color: var(--danger); text-align: center;">${err.message}</p>`;
            }
        }

        async function deleteSingleSample(embeddingId) {
            if (confirm("Bạn có chắc muốn xóa mẫu ảnh này?")) {
                const res = await fetch(`/api/embeddings/${embeddingId}`, { method: 'DELETE' });
                if (res.ok) {
                    openManageModal(currentPersonIdForModal, null);
                    loadPersons();
                } else {
                    alert("Xóa thất bại!");
                }
            }
        }

        function closeModal() {
            document.getElementById('sampleModal').style.display = 'none';
        }

        async function uploadMoreImages(personId, personName) {
            const input = document.getElementById(`addMoreInput_${personId}`);
            if (!input.files || input.files.length === 0) return;

            const formData = new FormData();
            formData.append('name', personName);
            for (let i = 0; i < input.files.length; i++) {
                formData.append('files', input.files[i]);
            }

            const res = await fetch('/api/register', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
            loadPersons();
        }

        async function renamePerson(id, oldName) {
            const newName = prompt("Nhập tên mới:", oldName);
            if (newName && newName !== oldName) {
                const formData = new FormData();
                formData.append('person_id', id);
                formData.append('new_name', newName);
                await fetch('/api/persons/rename', { method: 'PUT', body: formData });
                loadPersons();
            }
        }

        async function deletePerson(id) {
            if (confirm("Xóa hoàn toàn người này khỏi hệ thống?")) {
                await fetch(`/api/persons/${id}`, { method: 'DELETE' });
                loadPersons();
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('personName').value;
            const files = document.getElementById('faceImageInput').files;

            const formData = new FormData();
            formData.append('name', name);
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            const res = await fetch('/api/register', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
            if (data.status === 'success') {
                document.getElementById('registerForm').reset();
                loadPersons();
            }
        });

        document.getElementById('uploadVideoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('videoFileInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/upload_video', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.status === 'success') {
                currentSource = 'file';
                const streamImg = document.getElementById('cameraStream');
                streamImg.src = `/video_feed?source=file&t=${new Date().getTime()}`;
            }
        });
    </script>
</body>
</html>
